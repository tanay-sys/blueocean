<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BlueOcean</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0f4c75">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BlueOcean">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f3f6f9;--card:#fff;--ink:#14212e;--muted:#64748b;--line:#e3e9f0;
  --th:#f8fafc;--cur:#eff6ff;--hdr:#0f4c75;--bo:#2b7bb9;--eco:#334155;--std:#d97706;--good:#2e7d32;--bad:#c0392b;--accent:#0f4c75;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--hdr);color:#fff;padding:9px 18px}
header .row{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:4px 24px;align-items:baseline;justify-content:space-between}
header h1{margin:0;font-size:16px;font-weight:650;display:flex;align-items:center;gap:10px}
.hlogo{background:#fff;border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none}.hlogo img{width:26px;height:26px;display:block}
header .meta{font-size:12px;opacity:.92}
nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav .row{max-width:1280px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 10px}
nav button{border:0;background:none;padding:10px 16px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:14px 12px 30px}
section{display:none}section.on{display:block}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.c2{grid-template-columns:1fr 1fr}
.card{overflow-x:auto}
@media(max-width:700px){.g2,.g3,.c2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.card h3{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sub{font-size:12px;color:var(--muted);margin:0 0 6px}
.gc{display:flex;gap:12px;align-items:center}
.gc .dn{position:relative;width:104px;height:104px;flex:none}
.gc .tx{min-width:0}
.big{font-size:25px;font-weight:700;line-height:1.1}
.big small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.d{font-size:12.5px}
.two{display:flex;gap:10px}
.two>div{flex:1;text-align:center}
.two .dn{position:relative;width:92px;height:92px;margin:0 auto}
.two .l{font-size:12px;font-weight:600;margin-top:2px}
.two .s{font-size:11.5px;color:var(--muted)}
.good{color:var(--good)}.bad{color:var(--bad)}.mut{color:var(--muted)}.amb{color:#b45309}
.chd{position:relative;height:230px}
.chd.t{height:300px}
h2{font-size:14px;margin:18px 0 8px;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--th);font-weight:650;color:var(--muted)}
th:first-child,td:first-child,td.l,th.l{text-align:left}
td.bt{min-width:84px}
tr.cur td{font-weight:700;background:var(--cur)}
tr.tot td{font-weight:700;border-top:2px solid var(--line);background:var(--th)}
td.rm{white-space:normal;text-align:left;min-width:160px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.dot.g{background:var(--good)}.dot.r{background:var(--bad)}.dot.a{background:#f59e0b}.dot.n{background:#cbd5e1}
.chip{display:inline-block;padding:3px 10px;margin:2px 4px 2px 0;border-radius:14px;font-size:12px;font-weight:600;background:#fdecea;color:var(--bad)}
.chip.g{background:#e8f5e9;color:var(--good)}.chip.a{background:#fff4dc;color:#b45309}
.note{font-size:12px;color:var(--muted);background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 12px;margin:10px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.seg button{border:0;background:var(--card);padding:6px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.sect{background:#f8fafc;font-weight:700;color:var(--accent)}
.scroll{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:8px}
footer{max-width:1280px;margin:0 auto;padding:0 12px 24px;color:var(--muted);font-size:11.5px}
@media print{nav{display:none}section{display:block!important;page-break-inside:avoid}}
#lock{position:fixed;inset:0;z-index:99;background:linear-gradient(180deg,#071f36,#0f4c75);display:flex;align-items:center;justify-content:center;padding:20px;color:#fff}
#lock .box{width:100%;max-width:340px}
#lock .lgc{background:#fff;border-radius:14px;padding:12px 16px;margin:0 auto 20px;width:270px}
#lock .lgc img{width:100%;display:block}
#lock .lg{width:64px;height:64px;border-radius:16px;background:#071f36;border:2px solid #3b8fd0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;margin:0 auto 14px}
#lock h2{color:#fff;text-align:center;margin:0 0 4px;font-size:20px}
#lock p{text-align:center;margin:0 0 26px;font-size:12.5px;opacity:.75}
#lock label{font-size:12px;opacity:.8;display:block}
#lock input{width:100%;background:#ffffff1f;border:1px solid #ffffff55;border-radius:10px;padding:12px;margin:5px 0 14px;font:inherit;font-size:15px;color:#fff;outline:0}
#lock input:focus{border-color:#7cc3f5}
#lock button{width:100%;background:#2b9bf0;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:700;color:#fff;font-size:15px;cursor:pointer}
#lock button:disabled{opacity:.6}
#lock .err{color:#ffb4a8;font-size:12.5px;min-height:18px;margin:0 0 8px;text-align:center}
#lock .n{text-align:center;font-size:11.5px;opacity:.6;margin-top:14px}
body.dark{--bg:#0b1722;--card:#12212f;--ink:#e6edf3;--muted:#9db0c2;--line:#233648;--accent:#6bb8f0;--th:#182b3b;--cur:#17324a;--hdr:#0b3a5a}
body.dark .note{background:#3a2f12;border-color:#6b5a1f;color:#e9d9a6}
body.dark .chip{background:#4a1f1b}body.dark .chip.g{background:#1d3a20}body.dark .chip.a{background:#473410}
body.dark .sect{background:var(--th)}
body.sz1{zoom:1.12}body.sz2{zoom:1.25}
header .row{align-items:center}
.tools{display:flex;gap:6px;align-items:center}
.tools button{border:1px solid #ffffff55;background:#ffffff1a;color:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.hg{grid-template-columns:repeat(4,1fr)}
.tile{cursor:pointer;position:relative;padding-right:26px}
.tile:active{transform:scale(.99)}
.tile .go{position:absolute;right:11px;top:50%;margin-top:-10px;color:var(--muted);font-size:18px}
.tile .big{font-size:26px}
.tile .d{margin-top:3px}
.tile h3{display:flex;align-items:center;gap:7px}
.impg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.impg .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650}.impg .v{font-size:24px;font-weight:700;line-height:1.25}.impg .v small{font-size:13px;font-weight:500;color:var(--muted)}.impg .s{font-size:12px;color:var(--muted)}
@media(max-width:700px){.impg{grid-template-columns:1fr 1fr}}
.daybar{display:flex;align-items:center;gap:8px;margin:2px 0 12px;flex-wrap:wrap}
.daybar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;font-weight:700;cursor:pointer}
.daybar button:disabled{opacity:.35}
.daybar .dl{font-size:16px;font-weight:700;min-width:120px;text-align:center}
.daybar select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px;font:inherit}
.ov{position:fixed;inset:0;background:#0009;z-index:60;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 24px}
.sheet h3{margin:0 0 10px;font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0;display:flex;justify-content:space-between;align-items:center}
.sheet .x{border:0;background:var(--th);color:var(--ink);border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer}
.sheet .row2{display:grid;gap:8px}
.sheet .act{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px;font:inherit;font-weight:650;text-align:left;cursor:pointer;width:100%}
.sheet .act.wa{background:#25d366;border-color:#25d366;color:#06361b}
.sheet pre{white-space:pre-wrap;font:13px/1.5 system-ui,sans-serif;background:var(--th);border-radius:10px;padding:10px;margin:10px 0 0;max-height:240px;overflow:auto}
#bnav{display:none}
@media(max-width:700px){
  .hg{grid-template-columns:1fr 1fr}
  .tile .big{font-size:22px}.tile{padding-right:20px}
  nav{display:none}
  #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  #bnav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:10.5px;font-weight:650;padding:5px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  #bnav button.on{color:var(--accent)}
  #bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  body{padding-bottom:64px}
  header .meta{display:none}
}
#mSel{display:none;background:#ffffff1f;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:5px 6px;font:inherit;font-size:12.5px;max-width:150px}#mSel option{color:#14212e}#arcBar{display:none;background:#fff4d6;color:#7a4b00;text-align:center;font-size:13px;font-weight:600;padding:8px 12px;border-bottom:1px solid #f0d9a0}
header{padding-top:env(safe-area-inset-top)}nav{padding-bottom:env(safe-area-inset-bottom)}#lock{padding-top:max(20px,env(safe-area-inset-top))}
</style>
</head>

<script>
const $ = id => document.getElementById(id);
function boot(D){
$('loading').style.display='none';
const TARGET_T = D.meta.targetT;
const TDISP = D.meta.targetDispT||5300;
const TBO = D.meta.targetBO||2700, TEC = D.meta.targetEC||2400;
const S = Object.assign({usable:.04,nonUsable:.015,creel:.005,drafter:.003,cutter:.004}, D.meta.std||{});
const STD = {yield:D.meta.stdYield, A:D.meta.stdA};
const C = {bo:'#2b7bb9', eco:'#334155', std:'#d97706', good:'#2e7d32', bad:'#c0392b', soft:'#cbd5e1'};
const PAL = ['#0f4c75','#2b7bb9','#64748b','#94a3b8','#d97706','#0e7490','#cbd5e1','#7c3aed'];

/* ---------- helpers ---------- */
const sum = (a,f) => a.reduce((s,x)=>s+(+(f?f(x):x)||0),0);
const n0 = v => Number(v).toLocaleString('en-IN',{maximumFractionDigits:0});
const n1 = v => Number(v).toLocaleString('en-IN',{minimumFractionDigits:1,maximumFractionDigits:1});
const n2 = v => Number(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = (v,d=1) => (v*100).toFixed(d)+'%';
const dlabel = s => { const d=new Date(s+'T00:00:00'); return d.getDate()+' '+d.toLocaleString('en',{month:'short'}); };
const dfull = s => { const d=new Date(s+'T00:00:00'); return d.getDate()+' '+d.toLocaleString('en',{month:'short'})+' '+d.getFullYear(); };
const sgn = (v,dp=1) => (v>0?'+':'')+Number(v).toFixed(dp);
const cls = (v,goodWhenPositive=true) => Math.abs(v)<1e-9?'mut':((v>0)===goodWhenPositive?'good':'bad');
const byDate = arr => { const m={}; arr.forEach(r=>{ const o=m[r.date]; if(!o){ m[r.date]=Object.assign({},r); return; } Object.keys(r).forEach(k=>{ if(k==='date') return; if(typeof r[k]==='number') o[k]=(o[k]||0)+r[k]; else if(!o[k]&&r[k]) o[k]=r[k]; }); }); return m; };

/* ---------- donut helpers (centre text plugin) ---------- */
Chart.register({id:'ctr',afterDraw(ch){
  const o=ch.options.plugins&&ch.options.plugins.ctr; if(!o||!o.text) return;
  const {ctx,chartArea:a}=ch, x=(a.left+a.right)/2, y=(a.top+a.bottom)/2;
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=o.color||CTXC; ctx.font='700 '+(o.size||18)+'px system-ui,Segoe UI,Arial';
  ctx.fillText(o.text,x,o.sub?y-6:y);
  if(o.sub){ ctx.fillStyle='#64748b'; ctx.font='500 10.5px system-ui,Segoe UI,Arial'; ctx.fillText(o.sub,x,y+11); }
  ctx.restore();
}});
let CTXC='#14212e', CARDC='#fff', TRACK='#e8edf3';
const charts=[];
function mk(id,cfg){ const el=$(id); if(!el) return; cfg.options=Object.assign({responsive:true,maintainAspectRatio:false},cfg.options||{}); const c=new Chart(el,cfg); charts.push(c); return c; }
/* gauge: value & target as ratio (e.g. 0.92 of target). good => green, else red */
function gauge(id,ratio,good,text,sub){
  const v=Math.max(0,Math.min(1,ratio)), col=(good==='a')?'#f59e0b':((good===true||good==='g')?C.good:C.bad);
  mk(id,{type:'doughnut',data:{datasets:[{data:[v,1-v],backgroundColor:[col,TRACK],borderWidth:0}]},
    options:{cutout:'74%',plugins:{legend:{display:false},tooltip:{enabled:false},ctr:{text:text,sub:sub,size:text.length>6?15:18}},animation:{duration:500}}});
}
function pie(id,labels,data,colors,opts){
  mk(id,{type:'doughnut',data:{labels:labels,datasets:[{data:data,backgroundColor:colors||PAL,borderWidth:2,borderColor:CARDC}]},
    options:{cutout:'58%',plugins:{legend:{position:'right',labels:{boxWidth:11,usePointStyle:true,font:{size:12}}},ctr:{text:(opts&&opts.center)||'',sub:(opts&&opts.sub)||'',size:19},
      tooltip:(opts&&opts.tip)?{callbacks:{label:c=>opts.tip(c)}}:{}}}});
}

/* ---------- derived data ---------- */
const sBO=byDate(D.spin_bo), sEC=byDate(D.spin_eco), dBO=byDate(D.draw_bo), dEC=byDate(D.draw_eco);
const days = D.draw_bo.filter(r=>r.total>0 && (dEC[r.date]||{}).total>0).map(r=>r.date);
const last = days[days.length-1];
const daysInMonth = D.meta.daysInMonth, elapsed = days.length;
function plantAgg(dm, sm, dl){   // dl = list of dates
  const f=k=>sum(dl,d=>(dm[d]||{})[k]), g=k=>sum(dl,d=>(sm[d]||{})[k]);
  const prodC=sum(dl,d=>(((sm[d]||{}).charging||0)>0)?((dm[d]||{}).total||0):0);   // production only on days whose spinning charging is entered (for yield)
  return {prodC:prodC,prod:f('total'),A:f('A'),B:f('B'),creel:f('creel'),drafter:f('drafter'),cutter:f('cutter'),ch:g('charging'),us:g('usable'),nu:g('nonUsable'),
          white:f('colWhite'),black:f('colBlack'),dtP:f('dtProcess'),dtE:f('dtElec'),dtM:f('dtMech'),dtU:f('dtUtil')};
}
const mBO=plantAgg(dBO,sBO,days), mEC=plantAgg(dEC,sEC,days);
const lBO=plantAgg(dBO,sBO,[last]), lEC=plantAgg(dEC,sEC,[last]);
const prodBO=mBO.prod/1000, prodEC=mEC.prod/1000, prodAll=prodBO+prodEC;
const yBO=mBO.prodC/mBO.ch, yEC=mEC.prodC/mEC.ch;
const disp = D.dispatch.filter(r=>r.plant==='Eco'||r.plant==='Cotsyn');
const dispT=sum(disp,r=>r.qty)/1000, dispV=sum(disp,r=>r.value)/1e5;
const dispDays=[...new Set(disp.map(r=>r.date))].sort();
const dsh=s=>{const d=new Date(s+'T00:00:00');return d.getDate()+' '+d.toLocaleString('en',{month:'short'})};
const barTd=(v)=>`<td>${n1(v)}</td>`;
// two side-by-side tables of per-day figures (first half of the month left, second half right), latest day highlighted
function dailyBlock(dates, heads, rowFn, totFn, lastDate){
  const half=Math.ceil(dates.length/2), parts=[dates.slice(0,half),dates.slice(half)].filter(a=>a.length);
  const tbl=(ds,withTot)=>`<div class="card"><table><tr><th class="l">Date</th>${heads.map(h=>'<th>'+h+'</th>').join('')}</tr>${ds.map(d=>`<tr${d===lastDate?' class="cur"':''}><td class="l">${dsh(d)}</td>${rowFn(d)}</tr>`).join('')}${withTot?`<tr class="tot"><td class="l">Month</td>${totFn()}</tr>`:''}</table></div>`;
  return `<div class="grid g2">${parts.map((a,i)=>tbl(a,i===parts.length-1)).join('')}</div>`;
}
const wl1=D.wl1, wl2=D.wl2;
[...wl1,...wl2].forEach(r=>{ r.run=r.actChg>0; r.ok=r.actChg>0 && r.stdProd>0; });
const wlRun = rows=>rows.filter(r=>r.run);
const wlLastRow = rows=>{const x=wlRun(rows); return x[x.length-1];};

/* ---------- Standard vs Actual engine ---------- */
/* item: {k,label,std,hi(true=higher is better),fmt,val(agg)} */
const PL_ITEMS = [
  {k:'yield',  label:'Yield (drawline ÷ charging)', std:STD.yield, hi:true,  val:a=>a.prodC/a.ch},
  {k:'A',      label:'A-grade share',               std:STD.A,     hi:true,  val:a=>a.A/a.prod},
  {k:'us',     label:'Usable waste (% of charging)',std:S.usable,   hi:false, val:a=>a.us/a.ch},
  {k:'nu',     label:'Non-usable waste (% of charging)',std:S.nonUsable,hi:false,val:a=>a.nu/a.ch},
  {k:'creel',  label:'Creel waste (% of production)',std:S.creel,   hi:false, val:a=>a.creel/a.prod, dp:2},
  {k:'drafter',label:'Drafter waste (% of production)',std:S.drafter,hi:false,val:a=>a.drafter/a.prod,dp:2},
  {k:'cutter', label:'Cutter waste (% of production)',std:S.cutter, hi:false, val:a=>a.cutter/a.prod,dp:2}
];
const NEAR = 0.015;   // within 1.5% (relative) of the standard = amber
function stat(v,std,hi){ if(v==null) return null; if(hi?v>=std-1e-12:v<=std+1e-12) return 'g'; return Math.abs(v-std)<=NEAR*Math.abs(std)?'a':'r'; }
function svaRows(mA,lA){
  return PL_ITEMS.map(it=>{
    const m=it.val(mA), l=lA.prod>0?it.val(lA):null, dp=it.dp||1;
    return {label:it.label,std:it.std,m:m,l:l,hi:it.hi,dp:dp,st:stat(m,it.std,it.hi),stL:stat(l,it.std,it.hi)};
  });
}
const rowsBO=svaRows(mBO,lBO), rowsEC=svaRows(mEC,lEC);
function wlSva(rows){
  const run=wlRun(rows), ok=run.filter(r=>r.ok), lr=wlLastRow(rows);
  if(!run.length) return {items:[],last:null};
  const T=(a,k)=>sum(a,r=>r[k]);
  const items=[
    {label:'Production (t)', std:T(ok,'stdProd'), m:T(ok,'actProd'), l:lr.ok?lr.actProd:null, ls:lr.ok?lr.stdProd:null, hi:true},
    {label:'Charging (t)', std:T(run,'stdChg'), m:T(run,'actChg'), l:lr.actChg, ls:lr.stdChg, hi:true},
    {label:'Manpower (avg / day)', std:T(run,'stdMP')/run.length, m:T(run,'actMP')/run.length, l:lr.actMP, ls:lr.stdMP, hi:false},
    {label:'Breakdown (hrs)', std:0, m:T(run,'bd'), l:lr.bd, ls:0, hi:false, mon:true}
  ];
  items.forEach(i=>{ i.st=i.mon?'n':stat(i.m,i.std,i.hi); i.stL=i.mon?'n':stat(i.l,i.ls,i.hi); });
  return {items:items,last:lr.date};
}

/* ---------- import landed cost (October) ---------- */
/* Material = invoice qty x rate ($/MT) x exchange rate. Charges exclude GST (credit is taken). Weight claims are shown separately. */
function landed(r){
  // the Import Lumps FMS "Details Import" tab already calculates landed cost; use it. Fall back to our own formula when the sheet has none.
  if(r.landed>0&&r.netWt>0) return {fx:r.avgFx>0?r.avgFx:(r.fxBal>0?r.fxBal:r.fxAdv),chg:r.total,mat:r.material>0?r.material:r.landed-r.total,tot:r.landed,kg:r.landedKg>0?r.landedKg:r.landed/(r.netWt*1000),chgKg:r.total/(r.netWt*1000),ok:true};
  const fx=r.avgFx>0?r.avgFx:((r.fxAdv>0&&r.fxBal>0)?(r.fxAdv+r.fxBal)/2:(r.fxBal>0?r.fxBal:(r.fxAdv>0?r.fxAdv:0)));
  const chg=Math.max(0,r.total-(r.shippingGst+r.concorGst+r.transportGst+r.chaGst+r.customsGst));
  const mat=fx>0?r.invQty*r.rate*fx:null, ok=mat!=null&&r.netWt>0;
  return {fx:fx,chg:chg,mat:mat,tot:ok?mat+chg:null,kg:ok?(mat+chg)/(r.netWt*1000):null,chgKg:r.netWt>0?chg/(r.netWt*1000):null,ok:ok};
}
function landedSum(im){
  const L=im.map(landed), okR=im.filter((r,i)=>L[i].ok), okL=L.filter(x=>x.ok);
  const netOk=sum(okR,r=>r.netWt), netAll=sum(im,r=>r.netWt);
  return {L:L,nOk:okR.length,n:im.length,mat:sum(okL,x=>x.mat),chgOk:sum(okL,x=>x.chg),chgAll:sum(L,x=>x.chg),netOk:netOk,netAll:netAll,
    kg:netOk>0?(sum(okL,x=>x.tot))/(netOk*1000):null,chgKg:netAll>0?sum(L,x=>x.chg)/(netAll*1000):null};
}

function attention(v){
  const out=[];
  const sv=[]; [['BlueOcean',rowsBO],['Eco',rowsEC]].forEach(([n,rows])=>rows.forEach(r=>{ if(r.st==='r') sv.push(n+' · '+r.label.split(' (')[0]); }));
  [['WL1',W1],['WL2',W2]].forEach(([n,w])=>w.items.forEach(i=>{ if(i.st==='r'&&!i.mon) sv.push(n+' · '+i.label.split(' (')[0]); }));
  if(sv.length) out.push(['r',sv.length+' item'+(sv.length>1?'s':'')+' off standard this month','sva']);
  if(v.p<v.need*0.95) out.push(['r','Production '+n0(v.p)+' t is below daily need '+n0(v.need)+' t','production']);
  if(v.proj<TARGET_T) out.push(['a','Month projection '+n0(v.proj)+' t is below target '+n0(TARGET_T)+' t','overview']);
  if(v.mQ/Math.max(1,v.n)*daysInMonth<TDISP*0.97) out.push(['a','Dispatch projection '+n0(v.mQ/Math.max(1,v.n)*daysInMonth)+' t is below target '+n0(TDISP)+' t','dispatch']);

  if(v.bottleDays!=null&&v.bottleDays<5) out.push(['r','Bottle stock covers only '+n1(v.bottleDays)+' days','stock']);
  if(v.imFlag) out.push(['a',v.imFlag+' import invoice'+(v.imFlag>1?'s':'')+' with weight difference above 2%','imports']);

}

/* ---------- drill-down sheet ---------- */
let dChart=null;
function closeSheet(){ $('ov').classList.remove('on'); if(dChart){ dChart.destroy(); dChart=null; } }
$('ov').onclick=e=>{ if(e.target.id==='ov') closeSheet(); };
function sheet(html){ if(dChart){ dChart.destroy(); dChart=null; } $('sheet').innerHTML=html; $('ov').classList.add('on'); }
function drillTable(heads,rows){ return `<div class="scroll" style="max-height:230px;margin-top:10px"><table><tr>${heads.map((h,i)=>`<th${i?'':' class="l"'}>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?'':' class="l"'}>${c}</td>`).join('')}</tr>`).join('')}</table></div>`; }
function drill(k){
  if(k==='stock'){ closeSheet(); return gotoTab('stock'); }
  const dl=days.filter(x=>x<=HD), nav=(t)=>`<h3>${t}<button class="x" onclick="closeSheet()">✕</button></h3><div class="chd" style="height:210px"><canvas id="dch"></canvas></div>`;
  const grid=document.body.classList.contains('dark')?'#233648':'rgba(0,0,0,.08)';
  const draw=(type,labels,sets,opt)=>{ dChart=new Chart($('dch'),{type:type,data:{labels:labels,datasets:sets},options:Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:sets.length>1,labels:{boxWidth:10}}},scales:{x:{stacked:!!(opt&&opt.stack),grid:{display:false}},y:{stacked:!!(opt&&opt.stack),grid:{color:grid},beginAtZero:!(opt&&opt.noZero)}}},opt&&opt.o||{})}); };
  const lab=dl.map(dsh);
  if(k==='prod'){
    const b=dl.map(d=>+(((dBO[d]||{}).total||0)/1000).toFixed(1)), e=dl.map(d=>+(((dEC[d]||{}).total||0)/1000).toFixed(1));
    sheet(nav('Daily production (t)')+drillTable(['Date','BlueOcean','Eco','Total'],dl.map((d,i)=>[dsh(d),n1(b[i]),n1(e[i]),'<b>'+n1(b[i]+e[i])+'</b>']).reverse()));
    draw('bar',lab,[{label:'BlueOcean',data:b,backgroundColor:C.bo},{label:'Eco',data:e,backgroundColor:C.eco}],{stack:1});
  } else if(k==='disp'){
    const dd=[...new Set(disp.filter(r=>r.date<=HD).map(r=>r.date))].sort(), q=dd.map(d=>sum(disp.filter(r=>r.date===d),r=>r.qty)/1000), vv=dd.map(d=>sum(disp.filter(r=>r.date===d),r=>r.value)/1e5);
    sheet(nav('Daily dispatch (t)')+drillTable(['Date','Tonnes','₹ lakh','Avg ₹/kg'],dd.map((d,i)=>[dsh(d),n1(q[i]),n1(vv[i]),q[i]>0?n1(vv[i]*1e5/(q[i]*1000)):'–']).reverse()));
    draw('bar',dd.map(dsh),[{label:'Dispatch (t)',data:q.map(x=>+x.toFixed(1)),backgroundColor:C.bo}]);
  } else if(k==='yield'){
    const yv=(m,s,d)=>{ const a=plantAgg(m,s,[d]); return a.ch?+(a.prodC/a.ch*100).toFixed(1):null; };
    const b=dl.map(d=>yv(dBO,sBO,d)), e=dl.map(d=>yv(dEC,sEC,d));
    sheet(nav('Daily yield % (std '+pct(STD.yield,0)+')')+drillTable(['Date','BlueOcean %','Eco %'],dl.map((d,i)=>[dsh(d),b[i]==null?'–':n1(b[i]),e[i]==null?'–':n1(e[i])]).reverse()));
    draw('line',lab,[{label:'BlueOcean',data:b,borderColor:C.bo,backgroundColor:C.bo,tension:.25},{label:'Eco',data:e,borderColor:C.eco,backgroundColor:C.eco,tension:.25},{label:'Standard',data:dl.map(()=>STD.yield*100),borderColor:C.std,borderDash:[5,4],pointRadius:0}],{noZero:1});
  } else if(k==='petty'){
    const pc=(D.accPetty||[]).filter(r=>r.date<=HD);
    sheet(nav('Petty cash · closing balance (₹)')+drillTable(['Date','Received','Spent','Closing'],pc.map(r=>[dsh(r.date),n0(r.received),n0(r.expenses),'<b>'+n0(r.closing)+'</b>']).reverse()));
    draw('line',pc.map(r=>dsh(r.date)),[{label:'Closing',data:pc.map(r=>r.closing),borderColor:C.bo,backgroundColor:'#2b7bb933',fill:true,tension:.25}],{noZero:1});
  } else if(k==='bank'){
    const bk=(D.accBank||[]).filter(r=>r.date<=HD), bd=[...new Set(bk.map(r=>r.date))].sort(), rc=bd.map(d=>sum(bk.filter(r=>r.date===d),r=>r.received)/1e5), py=bd.map(d=>sum(bk.filter(r=>r.date===d),r=>r.payment)/1e5);
    sheet(nav('Bank · daily received vs paid (₹ lakh)')+drillTable(['Date','Received','Paid','Net'],bd.map((d,i)=>[dsh(d),n1(rc[i]),n1(py[i]),`<span class="${cls(rc[i]-py[i])}">${n1(rc[i]-py[i])}</span>`]).reverse())+'<div class="sub" style="margin-top:8px"><a href="#" onclick="closeSheet();return gotoTab(&#39;accounts&#39;)">Open Accounts tab</a> for balances per account.</div>');
    draw('bar',bd.map(dsh),[{label:'Received',data:rc.map(x=>+x.toFixed(1)),backgroundColor:C.good},{label:'Paid',data:py.map(x=>+x.toFixed(1)),backgroundColor:C.bad}]);
  }
}
window.drill=drill; window.closeSheet=closeSheet;

/* ================= STOCK ================= */

  const fgClose=x=>x[2][3];
  const fgTot=sum(fg,fgClose), fgBO=sum(fg.filter(x=>x[0]==='BlueOcean'),fgClose), fgEC=sum(fg.filter(x=>x[0]==='Eco'),fgClose);
  const coalOnly=coal.filter(c=>/coal/i.test(c.unit)), coalTot=sum(coalOnly,c=>c.closing);
  const minDays=coalOnly.filter(c=>c.avgDay>0).reduce((m,c)=>Math.min(m,c.days),1e9);
  const dayCls=d=>d<5?'bad':d<10?'amb':'good';
  const avgRate=dispV*1e5/(dispT*1000);
  const flBad=fl.filter(r=>r.flag).concat(bt.filter(r=>r.flag));
  const flTotal=(fl.find(r=>r.plant==='BlueOcean'&&r.item.toLowerCase()==='total')||{closing:0}).closing+(fl.find(r=>r.plant==='Eco'&&r.item.toLowerCase()==='total')||{closing:0}).closing;
  const btTotal=(bt.find(r=>r.item.toLowerCase()==='total')||{closing:0}).closing;
  const rmGroup=(plant)=>{ const a=rm.filter(r=>r.plant===plant&&r.kg>0), t=sum(a,r=>r.kg); const main=a.filter(r=>r.kg/t>=0.025).sort((x,y)=>y.kg-x.kg); const oth=t-sum(main,r=>r.kg); return {t:t,items:main.map(r=>[r.item+' · '+pct(r.kg/t,1),r.kg]).concat(oth>0?[['Others · '+pct(oth/t,1),oth]]:[])}; };
  const rmBO=rmGroup('BlueOcean'), rmEC=rmGroup('Eco');
  const byQ=(plant)=>{ const m={}; disp.filter(r=>r.plant===plant).forEach(r=>{const k=r.quality||'—'; (m[k]=m[k]||{t:0,v:0}); m[k].t+=r.qty/1000; m[k].v+=r.value/1e5;}); return Object.entries(m).sort((a,b)=>b[1].t-a[1].t); };
  const qTable=(title,plant)=>{ const rows=byQ(plant), T=sum(rows,r=>r[1].t), V=sum(rows,r=>r[1].v);
    return `<div class="card"><h3>${title}</h3><table><tr><th class="l">Quality / colour</th><th>Tonnes</th><th>₹ lakh</th><th>Avg ₹/kg</th></tr>
    ${rows.map(([k,v])=>`<tr><td class="l">${k}</td><td>${n1(v.t)}</td><td>${n1(v.v)}</td><td><b>${n1(v.v*1e5/(v.t*1000))}</b></td></tr>`).join('')}
    <tr style="font-weight:700"><td class="l">Total</td><td>${n1(T)}</td><td>${n1(V)}</td><td>${T>0?n1(V*1e5/(T*1000)):'–'}</td></tr></table></div>`; };
  const flTable=(plant)=>{ const rows=fl.filter(r=>r.plant===plant); if(!rows.length) return ''; const bo=plant==='BlueOcean';
    return `<div class="card"><h3>${plant} · flake stock (t)</h3><table><tr><th class="l">Material</th><th>Opening</th><th>Receipt</th><th>Consumption</th><th>Closing</th>${bo?'<th>Incl. U2</th>':''}</tr>
    ${rows.map(r=>`<tr${r.item.toLowerCase()==='total'?' style="font-weight:700"':''}><td class="l">${r.item}</td><td>${n1(r.opening)}</td><td>${r.receipt?n1(r.receipt):'–'}</td><td>${r.consumption?n1(r.consumption):'–'}</td><td class="${r.flag?'bad':''}"><b>${r.flag==='error'?'#REF!':n1(r.closing)}</b></td>${bo?`<td>${n1(r.total)}</td>`:''}</tr>`).join('')}</table>${bo?'<div class="sub" style="margin-top:6px">Closing = stock at Unit 3. "Incl. U2" adds stock transferred to Unit 2.</div>':'<div class="sub" style="margin-top:6px">Eco receipts include transfer from Unit 3.</div>'}</div>`; };
  const btTable=()=>{ if(!bt.length) return '';

    ${bt.map(r=>{const tot=r.line==='Total'; return `<tr${tot?' style="font-weight:700"':''}><td class="l">${r.item}</td><td>${n1(r.opening)}</td><td>${n1(r.receiving)}</td><td>${n1(r.consume)}</td><td>${r.sold?n1(r.sold):'–'}</td><td class="${r.flag?'bad':''}"><b>${r.flag==='error'?'#REF!':n1(r.closing)}</b></td></tr>`}).join('')}</table></div>`; };

    <div class="card"><h3>Dispatch rate · ${ds.length?ds[0].month:'this month'}</h3><div class="big">₹ ${n1(ds.length?ds[0].rate:avgRate)}<small>/kg</small></div><div class="d">${ds.length?`Freight ₹ ${n2(ds[0].freightKg)}/kg · ${n0(ds[0].perDay)} t/day`:''}</div></div>
    <div class="card"><h3>Bottle &amp; flake stock</h3><div class="big">${n0(flTotal+btTotal)}<small>t</small></div><div class="d">Flake ${n0(flTotal)} t · Bottle ${n0(btTotal)} t</div>${flBad.length?`<div class="d bad">${flBad.length} line(s) need correction in the sheet</div>`:`<div class="d mut">Washline Dashboard${D.meta.stockDate?' · '+D.meta.stockDate:''}</div>`}</div>
  </div>

  <h2>Finished goods stock (t)</h2>
  <div class="grid g2">
    <div class="card"><table><tr><th class="l">Plant · grade</th><th>Opening</th><th>Production</th><th>Dispatch</th><th>Closing</th><th>On hold</th></tr>
      ${fg.map(x=>`<tr><td class="l">${x[0]} · ${x[1]}</td><td>${n1(x[2][0])}</td><td>${n1(x[2][1])}</td><td>${n1(x[2][2])}</td><td><b>${n1(x[2][3])}</b></td><td>${x[2].length>4&&x[2][4]>0?`<b class="bad">${n1(x[2][4])}</b>`:'<span class="mut">–</span>'}</td></tr>`).join('')}
      <tr style="font-weight:700"><td class="l">Total</td><td>${n1(sum(fg,x=>x[2][0]))}</td><td>${n1(sum(fg,x=>x[2][1]))}</td><td>${n1(sum(fg,x=>x[2][2]))}</td><td>${n1(fgTot)}</td><td></td></tr></table></div>
    <div class="card"><h3>Closing stock by plant &amp; grade</h3><div class="chd"><canvas id="k1"></canvas></div></div>
  </div>

  <h2>Coal &amp; pellet stock${D.meta.coalDate?` · as on ${D.meta.coalDate}`:''}</h2>
  ${coal.length?`<div class="grid g2">
    <div class="card"><table><tr><th class="l">Unit</th><th>Closing t</th><th>Received t</th><th>Used t</th><th>Avg / day t</th><th>Days cover</th></tr>
      ${coal.map(c=>{const used=c.thermo+c.boiler5+c.boiler6+c.boiler1; return `<tr><td class="l">${c.unit}</td><td><b>${n1(c.closing)}</b></td><td>${n1(c.received)}</td><td>${n1(used)}</td><td>${n1(c.avgDay)}</td><td class="${c.avgDay>0?dayCls(c.days):'mut'}"><b>${c.avgDay>0?n1(c.days):'–'}</b></td></tr>`}).join('')}</table>
      <div class="sub" style="margin-top:6px">Days cover = closing stock ÷ average daily use. Red under 5 days, amber under 10. BlueOcean closing is after coal-stone sold. Opening of BlueOcean coal is negative in the sheet.</div></div>
    <div class="card"><h3>Closing stock by unit (t)</h3><div class="chd"><canvas id="k2"></canvas></div></div>
  </div>`:'<div class="card">Coal sheet not available. Check COAL_ID in the script.</div>'}

  <h2>RM mixing · % of charging this month</h2>
  <div class="grid g2">
    <div class="card"><h3>BlueOcean · RM mixing %</h3><div class="chd t"><canvas id="k3"></canvas></div></div>
    <div class="card"><h3>Eco · RM mixing %</h3><div class="chd t"><canvas id="k4"></canvas></div></div>
  </div>

  <h2>Bottle &amp; flake stock${D.meta.stockDate?` · as on ${D.meta.stockDate}`:''}</h2>

  ${fl.length?`<div class="grid g2">${flTable('BlueOcean')}${flTable('Eco')}</div>`:'<div class="card">No flake stock lines found on the Washline Dashboard tab.</div>'}
  ${bt.length?`<div class="grid g2">${btTable()}<div class="card"><h3>Bottle &amp; flake · closing stock (t)</h3><div class="chd"><canvas id="k5"></canvas></div></div></div>`:''}

  <h2>Dispatch per kg · overall summary F.Y. 2026-27</h2>

    ${ds.map((r,i)=>{const tot=/^(current|year)/i.test(r.month); return `<tr${tot?' style="font-weight:700;background:var(--bg2,#f3f6fa)"':''}><td class="l">${r.month}</td><td>${n0(r.prod)}</td><td>${n0(r.disp)}</td><td>${n0(r.value)}</td><td>${n1(r.freight)}</td><td><b>${n1(r.rate)}</b></td><td>${n2(r.freightKg)}</td><td>${n1(r.perDay)}</td></tr>`}).join('')}</table>

  pie('k1',fg.map(x=>x[0]+' '+x[1]),fg.map(x=>+fgClose(x).toFixed(1)),['#2b7bb9','#94c3e6','#334155','#94a3b8'],{center:n0(fgTot)+' t',sub:'closing'});

};


/* ================= DENSIFIER ================= */
RENDER.densifier = ()=>{
  const dn=D.dens||[], dd=D.densDay||[];
  const T=kg=>kg/1000, sec=k=>dn.filter(r=>r.section===k);
  const raw=sec('rawlump'), fg=sec('fglump'), pop=sec('pop'), pow=sec('powder'), rm=sec('rm');
  if(!dn.length){ $('s-densifier').innerHTML='<div class="card">Densifier workbook not available. Check the Densifier notice at the top of the page.</div>'; return; }
  const prod=sum(fg,r=>r.inn), cons=sum(raw,r=>r.out), recv=sum(raw,r=>r.inn), issued=sum(fg,r=>r.out), eco=sum(fg,r=>r.eco)+sum(pop,r=>r.eco);
  const fgClose=sum(fg,r=>r.closing), rawClose=sum(raw,r=>r.closing), popClose=sum(pop,r=>r.closing);
  const lastD=dd.length?dd[dd.length-1].date:'';
  const tbl=(heads,rows,fn,tot)=>`<table><tr><th class="l">${heads[0]}</th>${heads.slice(1).map(h=>'<th>'+h+'</th>').join('')}</tr>${rows.map(fn).join('')}${tot?`<tr class="tot">${tot}</tr>`:''}</table>`;
  const c=(v)=>`<td>${n1(T(v))}</td>`;
  $('s-densifier').innerHTML = `
  <div class="grid g4">
    <div class="card"><h3>Lump produced · month</h3><div class="big">${n0(T(prod))}<small>t</small></div><div class="d">From ${n0(T(cons))} t consumed · yield <b>${pct(prod/cons,1)}</b></div></div>
    <div class="card"><h3>Raw lump received</h3><div class="big">${n0(T(recv))}<small>t</small></div><div class="d">Consumed ${n0(T(cons))} t · closing <b>${n1(T(rawClose))} t</b></div></div>
    <div class="card"><h3>Issued to spinning</h3><div class="big">${n0(T(issued))}<small>t</small></div><div class="d">Lump issued · of which to Eco (lump + popcorn) ${n0(T(eco))} t</div></div>
    <div class="card"><h3>FG stock</h3><div class="big">${n0(T(fgClose+popClose))}<small>t</small></div><div class="d">Lump ${n0(T(fgClose))} t · Popcorn ${n0(T(popClose))} t</div></div>
  </div>

  <h2>Raw lump · input (t)</h2>
  <div class="grid g2">
    <div class="card">${tbl(['Material','Opening','Received','Consumed','Closing'],raw,r=>`<tr><td class="l">${r.item}</td>${c(r.opening)}${c(r.inn)}${c(r.out)}${c(r.closing,1)}</tr>`,`<td class="l">Total</td>${c(sum(raw,r=>r.opening))}${c(recv)}${c(cons)}${c(rawClose,1)}`)}</div>
    <div class="card"><h3>Lump produced by type (t)</h3><div class="chd" style="height:190px"><canvas id="dn1"></canvas></div></div>
  </div>

  <h2>Finished lump · output (t)</h2>
  <div class="card">${tbl(['Lump','Opening','Production','Issued to spinning','of which Eco','Closing'],fg,r=>`<tr><td class="l">${r.item}</td>${c(r.opening)}${c(r.inn)}${c(r.out)}<td>${r.eco?n1(T(r.eco)):'–'}</td>${c(r.closing,1)}</tr>`,`<td class="l">Total</td>${c(sum(fg,r=>r.opening))}${c(prod)}${c(issued)}<td>${n1(T(sum(fg,r=>r.eco)))}</td>${c(fgClose,1)}`)}</div>

  <h2>Popcorn &amp; powder (t)</h2>
  <div class="grid g2">
    <div class="card"><h3>Finished popcorn</h3>${tbl(['Item','Opening','Production','Issued','of which Eco','Closing'],pop,r=>`<tr><td class="l">${r.item}</td>${c(r.opening)}${c(r.inn)}${c(r.out)}<td>${r.eco?n1(T(r.eco)):'–'}</td>${c(r.closing,1)}</tr>`)}</div>
    <div class="card"><h3>Powder stock</h3>${tbl(['Item','Opening','Production','Issued','Closing'],pow,r=>`<tr><td class="l">${r.item}</td>${c(r.opening)}${c(r.inn)}${c(r.out)}${c(r.closing,1)}</tr>`)}</div>
  </div>

  <h2>Wiry / film raw material (t)</h2>
  <div class="card">${tbl(['Material','Opening','Received','Consumed','Closing'],rm,r=>`<tr><td class="l">${r.item}</td>${c(r.opening)}${c(r.inn)}${c(r.out)}${c(r.closing,1)}</tr>`)}</div>

  <h2>Daily · lump (t)</h2>
  ${dd.length?(()=>{ const mx=Math.max(...dd.map(r=>r.prod)); const m={}; dd.forEach(r=>m[r.date]=r);
    return dailyBlock(dd.map(r=>r.date),['Received','Consumed','Produced','Yield %','Issued to spinning'],d=>{const r=m[d]; return `<td>${n1(T(r.recv))}</td><td>${n1(T(r.cons))}</td>${barTd(T(r.prod),T(mx),'#fde68a')}<td>${r.cons>0?n1(r.prod/r.cons*100):'–'}</td><td>${n1(T(r.issued))}</td>`},()=>`<td>${n0(T(recv))}</td><td>${n0(T(cons))}</td><td>${n0(T(prod))}</td><td>${n1(prod/cons*100)}</td><td>${n0(T(issued))}</td>`,lastD)+`<div class="sub">All lump types together. Received = raw lump received, Consumed = raw lump fed to the densifier, Produced = finished lump. Highlighted row = latest day (${dsh(lastD)}).</div>`; })():''}`;
  pie('dn1',fg.map(r=>r.item),fg.map(r=>+T(r.inn).toFixed(1)),['#0f4c75','#2b7bb9','#94a3b8','#14212e'],{center:n0(T(prod))+' t',sub:'produced'});
};

/* ================= EXPENSES ================= */
let EXM=0;   // selected month number (0 = latest with data)
RENDER.expenses = ()=>{
  const X=D.expenses||[];
  if(!X.length){ $('s-expenses').innerHTML='<div class="card">Expenses data will appear after the next data refresh (it runs every hour).</div>'; return; }
  const METS=[['electrical','Electrical expenses',1],['mechanical','Mechanical expenses',1],['maintenance','Maintenance',1],['forklift','Forklift diesel',0],['power','Power (MPEB)',0]];
  const PL=[['BlueOcean',C.bo],['Eco',C.eco]];
  const months=[...new Set(X.map(r=>r.month))].sort((a,b)=>a-b);
  const MN=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if(!months.includes(EXM)) EXM=months[months.length-1];
  const get=(m,pl,mo)=>X.find(r=>r.metric===m&&r.plant===pl&&r.month===mo);

    $('wlbody').innerHTML = `
    <div class="grid g4">
      <div class="card"><h3>Production vs standard</h3><div class="gc">${dnut('w1')}<div class="tx"><div class="big">${n1(g(0).m)}<small>t</small></div><div class="d">Std ${n1(g(0).std)} t · <b class="${stc(g(0).st)}">${sgn(g(0).m-g(0).std)} t</b></div></div></div></div>
      <div class="card"><h3>Charging vs standard</h3><div class="gc">${dnut('w2')}<div class="tx"><div class="big">${n1(g(1).m)}<small>t</small></div><div class="d">Std ${n1(g(1).std)} t · <b class="${stc(g(1).st)}">${sgn(g(1).m-g(1).std)} t</b></div></div></div></div>
      <div class="card"><h3>Manpower / run day</h3><div class="gc">${dnut('w3')}<div class="tx"><div class="big">${n0(g(2).m)}</div><div class="d">Std ${n0(g(2).std)} · <b class="${stc(g(2).st)}">${sgn(g(2).m-g(2).std,0)} per day</b></div></div></div></div>
      <div class="card"><h3>Breakdown</h3><div class="big">${n1(g(3).m)}<small>hrs</small></div><div class="d">${bdRows.length} of ${nrun} run days · ${rows.filter(r=>!r.run).length} days not run</div></div>
    </div>
    <div class="grid g2" style="margin-top:12px">
      <div class="card"><h3>Breakdown hours by reason</h3>${rsl.length?`<div class="chd"><canvas id="w4"></canvas></div>`:'<div class="sub">No breakdown hours logged.</div>'}</div>
      <div class="card"><h3>Longest breakdowns</h3>${worst.length?`<table><tr><th class="l">Date</th><th>Hrs</th><th class="l">Remark</th></tr>${worst.map(r=>`<tr><td class="l">${dfull(r.date)}</td><td class="bad">${n1(r.bd)}</td><td class="rm">${r.remark||''}</td></tr>`).join('')}</table>`:'<div class="sub">None.</div>'}</div>
    </div>
    ${dq.length?`<div class="note">⚠ Please verify in source: ${dq.map(r=>dlabel(r.date)+(r.stdProd<=0?' (no standard entered)':' (production '+n1(r.actProd)+' t exceeds charging '+n1(r.actChg)+' t)')).join(', ')}. Days without a standard are left out of the standard comparison.</div>`:''}`;
    gauge('w1',g(0).m/g(0).std,g(0).st,pct(g(0).m/g(0).std,0),'');
    gauge('w2',g(1).m/g(1).std,g(1).st,pct(g(1).m/g(1).std,0),'');
    gauge('w3',g(2).m/Math.max(g(2).std,g(2).m,1),g(2).st,pct(g(2).m/g(2).std,0),'');
    if(rsl.length) pie('w4',rsl.map(r=>r[0]),rsl.map(r=>+r[1].toFixed(1)),null,{center:n1(sum(rsl,r=>r[1])),sub:'hours'});
  };
  draw(1);
  $('wlseg').onclick=e=>{const w=e.target.dataset.w; if(!w) return; [...$('wlseg').children].forEach(b=>b.classList.toggle('on',b===e.target)); draw(+w);};
};

/* ================= IMPORTS ================= */
RENDER.imports = ()=>{
  const im=D.imports||[];
  if(!im.length){ $('s-imports').innerHTML='<div class="card">No import data found for this month in the Import Lumps FMS.</div>'; return; }
  const ALERT=0.02;
  const cnt=r=>String(r.containers||'').split(',').map(x=>x.trim()).filter(Boolean).length;
  const T=k=>sum(im,r=>r[k]);
  const inv=T('invQty'), net=T('netWt'), diff=net-inv, charges=T('total'), loads=T('loads'), containers=sum(im,cnt);
  const dpct=r=>r.invQty>0?(r.netWt-r.invQty)/r.invQty:0;
  const flagged=im.filter(r=>Math.abs(dpct(r))>ALERT);
  const shortage=sum(im.filter(r=>r.netWt<r.invQty),r=>r.netWt-r.invQty), excess=sum(im.filter(r=>r.netWt>r.invQty),r=>r.netWt-r.invQty);
  const pm={}; im.forEach(r=>{const k=r.party||'—'; const o=(pm[k]=pm[k]||{n:0,q:0,w:0,ch:0}); o.n++;o.q+=r.invQty;o.w+=r.netWt;o.ch+=r.total;});
  const parties=Object.entries(pm).sort((a,b)=>b[1].w-a[1].w);
  const cats=[['Shipping',r=>r.shipping+r.shippingGst],['Customs',r=>r.customs+r.customsGst],['CONCOR',r=>r.concor+r.concorGst],['Transportation',r=>r.transport+r.transportGst],['CHA',r=>r.cha+r.chaGst],['Liaisoning',r=>r.liaison],['CPET',r=>r.cpet],['Other',r=>r.other]]
    .map(([k,f])=>[k,sum(im,f)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const LS=landedSum(im);
  const lrow=(r,x)=>`<tr><td class="l">${dsh(r.date)}</td><td class="l">${(r.party||'').replace(/ (PTE|LTD|LLC|FZC|SRL).*$/i,'')}</td><td>${n1(r.netWt)}</td><td>${r.rate?n0(r.rate):'–'}</td><td>${x.fx>0?n2(x.fx):'<span class="amb">pending</span>'}</td><td>${x.mat==null?'–':n2(x.mat/1e5)}</td><td>${n2(x.chg/1e5)}</td><td>${x.tot==null?'–':'<b>'+n2(x.tot/1e5)+'</b>'}</td><td>${x.kg==null?'–':'<b>'+n1(x.kg)+'</b>'}</td></tr>`;
  const landedHtml=`<h2>Landed cost · ${D.meta.month||'this month'}</h2>
  <div class="card"><div class="scroll"><table><tr><th class="l">Date</th><th class="l">Party</th><th>Net MT</th><th>Rate $/MT</th><th>Ex. rate ₹</th><th>Material ₹ L</th><th>Charges ₹ L</th><th>Landed ₹ L</th><th>Landed ₹/kg</th></tr>
    ${im.map((r,i)=>lrow(r,LS.L[i])).join('')}
    <tr class="tot"><td class="l" colspan="2">Total · ${LS.n} invoices</td><td>${n1(LS.netAll)}</td><td></td><td></td><td>${n2(LS.mat/1e5)}</td><td>${n2(LS.chgAll/1e5)}</td><td>${n2((LS.mat+LS.chgOk)/1e5)}</td><td>${LS.kg==null?'–':n1(LS.kg)}</td></tr></table></div>
    <div class="sub" style="margin-top:8px">Taken from the Details Import tab of the Import Lumps FMS: material = invoice qty × rate × average exchange rate; charges are without GST (input credit is taken). Landed ₹/kg = (material + charges) ÷ net weight received. Total row covers the ${LS.nOk} invoices that have an exchange rate${LS.nOk<LS.n?'; '+(LS.n-LS.nOk)+' still waiting for it':''}. Charges for all ${LS.n} invoices: ₹ ${n2(LS.chgAll/1e5)} lakh (₹ ${n1(LS.chgKg||0)}/kg).</div></div>`;
  $('s-imports').innerHTML = `
  ${landedHtml}
  <div class="grid g4" style="margin-top:12px">
    <div class="card"><h3>Invoices received</h3><div class="big">${n0(im.length)}</div><div class="d">${n0(containers)} containers · ${n0(loads)} loads</div></div>
    <div class="card"><h3>Net weight received</h3><div class="big">${n1(net)}<small>MT</small></div><div class="d">Invoice ${n1(inv)} MT · <b class="${cls(diff)}">${sgn(diff,2)} MT (${sgn(diff/inv*100,2)}%)</b></div></div>
    <div class="card"><h3>Shortage / excess</h3><div class="d">Shortage <b class="bad">${n1(shortage)} MT</b> · Excess <b class="good">+${n1(excess)} MT</b></div><div class="d">${flagged.length} invoice(s) beyond ±${ALERT*100}%</div></div>
    <div class="card"><h3>Import charges</h3><div class="big">${n1(charges/1e5)}<small>₹ lakh</small></div><div class="d">₹ ${n0(charges/net)} per MT · import charges, excl. material</div></div>
  </div>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><h3>Import charges by type (₹ lakh)</h3><div class="chd t"><canvas id="i1"></canvas></div></div>
    <div class="card"><h3>Net weight by party (MT)</h3><div class="chd t"><canvas id="i2"></canvas></div></div>
  </div>
  ${flagged.length?`<h2>Invoices beyond ±${ALERT*100}% weight difference</h2><div class="card"><table><tr><th class="l">Date</th><th class="l">Invoice</th><th class="l">Party</th><th>Invoice qty MT</th><th>Net wt MT</th><th>Diff %</th></tr>
    ${flagged.map(r=>`<tr><td class="l">${dfull(r.date)}</td><td class="l">${r.invoice}</td><td class="l">${r.party}</td><td>${n2(r.invQty)}</td><td>${n2(r.netWt)}</td><td class="${dpct(r)>0?'good':'bad'}">${sgn(dpct(r)*100,2)}%</td></tr>`).join('')}</table></div>`:''}
  <div class="note">Data from Import Lumps FMS › Details Import (month in that sheet: ${D.meta.importMonth||'n/a'}). Charges include GST lines and exclude the material price.</div>`;
  pie('i1',cats.map(c=>c[0]),cats.map(c=>+(c[1]/1e5).toFixed(2)),null,{center:n1(charges/1e5),sub:'₹ lakh'});
  pie('i2',parties.map(p=>p[0].length>24?p[0].slice(0,23)+'…':p[0]),parties.map(p=>+p[1].w.toFixed(1)),null,{center:n0(net),sub:'MT'});
};

$('foot').innerHTML = `Sources: October PRODUCTION BACKUP (spinning, drawline, dispatch) · Washline production Daily Reports (Monday Report, flake &amp; bottle stock) · Import Lumps FMS · Coal Purchase FMS · Densifier (Dencyfire) workbook. Standards: yield ${pct(STD.yield,0)}, A-grade ${pct(STD.A,1)}, usable waste ${pct(S.usable,1)}, non-usable ${pct(S.nonUsable,1)}, creel ${pct(S.creel,1)}, drafter ${pct(S.drafter,1)}, cutter ${pct(S.cutter,1)}; washline standards as per Monday Report. ${D.meta.month} target ${n0(TARGET_T)} t.`;
show('home');
}
function dec(x){ if(!x) return null; return JSON.parse(new TextDecoder('utf-8').decode(Uint8Array.from(atob(x),function(c){ return c.charCodeAt(0); }))); }
const API='https://script.google.com/macros/s/AKfycby3ciJfR9tCV0wxj4m4JLpcrNtnzxg0ZmlkAjlX2Wd9DArL5i1aiiqKqjcEtdFTOHKYxg/exec';
function ls2g(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function ls2s(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
function call(o){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o),redirect:'follow'})
    .then(function(r){ return r.json(); });
}
const NETERR='Could not connect. Please check the internet and try again.';
function setBusy(btn,on,label){ btn.disabled=on; if(label) btn.textContent=on?'Please wait...':label; }
function setupMonths(months,month){
  var sel=$('mSel'), arc=$('arcBar');
  if(!months||!months.list||months.list.length<2){ sel.style.display='none'; arc.style.display='none'; return; }
  sel.innerHTML=''; months.list.forEach(function(m){ var o=document.createElement('option'); o.value=m.key; o.textContent=m.label; if(m.key===month) o.selected=true; sel.appendChild(o); });
  sel.style.display='inline-block';
  sel.onchange=function(){ ls2s('bo_month', sel.value===months.current?null:sel.value); location.reload(); };
  if(month && month!==months.current){
    var lab=''; months.list.forEach(function(m){ if(m.key===month) lab=m.label; });
    arc.textContent='Viewing '+lab+' - saved final copy, not live. Choose the live month at the top to go back.'; arc.style.display='block';
  } else { arc.style.display='none'; }
}
function openDash(r){
  $('lock').style.display='none';
  setupMonths(r.months, r.month||'');
  boot(r.data);
}
function loadData(em,tok,mon){
  call({act:'data',email:em,token:tok,month:mon||''}).then(function(r){
    var w=$('lw'); if(w) w.remove();
    if(r&&r.ok){ openDash(r); }
    else if(r&&r.expired){ ls2s('bo_tok',null); showLogin(''); }
    else if(mon){ ls2s('bo_month',null); loadData(em,tok,''); }
    else { ls2s('bo_tok',null); showLogin((r&&r.msg)||''); }
  }).catch(function(){ var w=$('lw'); if(w) w.remove(); ls2s('bo_tok',null); showLogin(NETERR); });
}
function enter(r,email){
  ls2s('bo_tok',r.token); ls2s('bo_em',email);
  var chosen=ls2g('bo_month')||'';
  if(chosen && r.months && chosen!==r.months.current && chosen!==r.month){ loadData(email,r.token,chosen); }
  else { openDash(r); }
}
function showLogin(msg){
  $('lsub').style.display=''; $('lock').style.display='flex'; $('fSet').style.display='none'; $('fLogin').style.display='block';
  $('lerr').textContent=msg||''; var em=ls2g('bo_em'); if(em && !$('lemail').value) $('lemail').value=em;
}
$('fLogin').onsubmit=function(ev){
  ev.preventDefault();
  var email=$('lemail').value.trim().toLowerCase(), pw=$('lpw').value, b=$('lgo');
  $('lerr').textContent=''; setBusy(b,true,'Sign in');
  call({act:'login',email:email,pw:pw}).then(function(r){
    setBusy(b,false,'Sign in');
    if(r&&r.ok){ enter(r,email); } else { $('lerr').textContent=(r&&r.msg)||'Could not sign in.'; }
  }).catch(function(){ setBusy(b,false,'Sign in'); $('lerr').textContent=NETERR; });
};
$('lforgot').onclick=function(e){
  e.preventDefault(); $('fLogin').style.display='none'; $('fSet').style.display='block';
  $('serr').textContent=''; $('semail').value=$('lemail').value||ls2g('bo_em')||'';
};
$('sback').onclick=function(e){ e.preventDefault(); showLogin(''); };
$('ssend').onclick=function(){
  var email=$('semail').value.trim().toLowerCase(), b=$('ssend');
  if(email.indexOf('@')<0){ $('serr').textContent='Enter your work email first.'; return; }
  $('serr').textContent=''; setBusy(b,true,'Send code to my email');
  call({act:'code',email:email}).then(function(r){
    setBusy(b,false,'Send code to my email'); b.textContent='Send code again';
    $('sinfo').textContent=(r&&r.msg)||'Code sent.'; $('scode').focus();
  }).catch(function(){ setBusy(b,false,'Send code to my email'); $('serr').textContent=NETERR; });
};
$('fSet').onsubmit=function(ev){
  ev.preventDefault();
  var email=$('semail').value.trim().toLowerCase(), code=$('scode').value.trim(), p1=$('spw').value, p2=$('spw2').value, b=$('sgo');
  if(p1!==p2){ $('serr').textContent='The two passwords do not match.'; return; }
  $('serr').textContent=''; setBusy(b,true,'Save password & continue');
  call({act:'setpw',email:email,code:code,pw:p1}).then(function(r){
    setBusy(b,false,'Save password & continue');
    if(r&&r.ok){ enter(r,email); } else { $('serr').textContent=(r&&r.msg)||'Could not save the password.'; }
  }).catch(function(){ setBusy(b,false,'Save password & continue'); $('serr').textContent=NETERR; });
};
$('bOut').onclick=function(){ ls2s('bo_tok',null); location.reload(); };
(function start(){
  var tok=ls2g('bo_tok'), em=ls2g('bo_em');
  if(tok && em){
    $('lock').style.display='flex'; $('fLogin').style.display='none'; $('fSet').style.display='none'; $('lsub').style.display='none';
    $('lockbox').insertAdjacentHTML('beforeend','<div id="lw" class="n" style="font-size:13px;opacity:.8">Loading...</div>');
    loadData(em,tok,ls2g('bo_month')||'');
  } else { showLogin(''); }
})();
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
</script>
